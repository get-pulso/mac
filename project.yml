name: Firstlight
configs:
  Debug: debug
  Release: release    
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    exactVersion: 1.5.4
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.10.2
  Defaults:
    url: https://github.com/sindresorhus/Defaults.git
    exactVersion: 9.0.2
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    exactVersion: 1.9.2
  IsCameraOn:
    url: https://github.com/sindresorhus/is-camera-on.git
    exactVersion: 2.0.2
  Logging:
    url: https://github.com/apple/swift-log.git
    exactVersion: 1.6.3
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    exactVersion: 4.2.2
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    exactVersion: 1.2.1
  Nuke:
    url: https://github.com/kean/Nuke.git
    exactVersion: 13.0.6
  Realm:
    url: https://github.com/realm/realm-swift.git
    exactVersion: 20.0.5
  WindowAnimation:
    url: https://github.com/Lakr233/WindowAnimation.git
    exactVersion: 1.0.5
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.7.0
fileGroups:
  - App
targets:
  Firstlight:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Info.plist
          - Resources/Firstlight.entitlements
          - Resources/OnboardingShaders
          - Resources/BumpEmoji
      # Runtime Metal compilation; folder resource avoids an optional Metal-toolchain build step.
      - path: App/Resources/OnboardingShaders
        type: folder
        buildPhase: resources
      - path: App/Resources/BumpEmoji
        type: folder
        buildPhase: resources
      # The onboarding light condenses into the original AppIcon mark, sampled
      # from this file at runtime; the asset catalog only yields the app icon.
      - path: App/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
        buildPhase: resources
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Alamofire
      - package: Defaults
      - package: Dependencies
      - package: IsCameraOn
      - package: KeychainAccess
      - package: Logging
      - package: MenuBarExtraAccess
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: Realm
        product: RealmSwift
        embed: True
      - package: Sparkle
      - package: WindowAnimation
    preBuildScripts:
      - name: Require Developer ID signing
        basedOnDependencyAnalysis: False
        script: |
                expected_identity="Developer ID Application: 21st Labs Inc. (25UG4QYN9F)"
                expected_hash="8860656E61AD605EBC00898C674E0D8484E2B94D"
                if [ "${DEVELOPMENT_TEAM:-}" != "25UG4QYN9F" ] ||
                   [ "${CODE_SIGNING_ALLOWED:-NO}" != "YES" ] ||
                   [ "${CODE_SIGNING_REQUIRED:-NO}" != "YES" ] ||
                   { [ "${CODE_SIGN_IDENTITY:-}" != "$expected_identity" ] &&
                     [ "${CODE_SIGN_IDENTITY:-}" != "$expected_hash" ]; }; then
                  echo "error: Firstlight must be signed with $expected_identity. Use Scripts/run-local-signed.sh."
                  exit 1
                fi
                if ! security find-identity -v -p codesigning | grep -F "$expected_identity" >/dev/null; then
                  echo "error: Missing signing identity: $expected_identity"
                  exit 1
                fi
      - name: SwiftFormat
        basedOnDependencyAnalysis: False
        script: |
                if [ "${FIRSTLIGHT_SKIP_SWIFTFORMAT:-NO}" != "YES" ]; then
                  ~/bin/swiftformat --swiftversion 5.10 --config Scripts/.swiftformat "${SRCROOT}/App"
                fi
    settings:
      configs:
        Debug:
          FIRSTLIGHT_API_BASE_URL: http://localhost:3001
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: 21st Labs Inc. (25UG4QYN9F)"
          OTHER_CODE_SIGN_FLAGS: --timestamp=none
        Release:
          FIRSTLIGHT_API_BASE_URL: https://firstlight.sh
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: 21st Labs Inc. (25UG4QYN9F)"
      base:
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 9
        DEVELOPMENT_TEAM: 25UG4QYN9F
        SWIFT_VERSION: 5
        SDKROOT: macosx
        CLANG_ENABLE_MODULES: YES
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: 15.0
        ENABLE_TESTABILITY: YES
        CLANG_USE_OPTIMIZATION_PROFILE: NO
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        SWIFT_OPTIMIZE_OBJECT_LIFETIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Firstlight.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: sh.firstlight.mac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
schemes:
  Firstlight:
    build:
      targets:
        Firstlight: all
